name: Validador de Documentos

on:
  workflow_dispatch:
    inputs:
      tipo_documento:
        description: 'Tipo de documento'
        required: true
        default: 'CNPJ'
        type: choice
        options:
          - CPF
          - CNPJ
          - IE
      numero_documento:
        description: 'Número do documento (sem caracteres especiais)'
        required: true
        type: string

jobs:
  validar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
      
      - name: Instalar GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      
      - name: Compilar programa COBOL
        run: |
          mkdir -p bin
          cobc -x -o bin/validador \
            src/validador.cob \
            src/modulos/validar-cpf.cob \
            src/modulos/validar-cnpj.cob \
            src/modulos/validar-ie.cob
      
      - name: Executar validação
        run: |
          bin/validador "${{ github.event.inputs.tipo_documento }}" "${{ github.event.inputs.numero_documento }}"
      
      - name: Validação concluída
        if: always()
        run: echo "Validação finalizada!"
