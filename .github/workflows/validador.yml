name: Validador de Documentos

on:
  workflow_dispatch:
    inputs:
      tipo_documento:
        description: 'Tipo de documento'
        required: true
        default: 'cnpj'
        type: choice
        options:
          - cpf
          - cnpj
          - ie
      numero_documento:
        description: 'Número do documento (sem caracteres especiais)'
        required: true
        type: string

jobs:
  validar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3
      
      - name: Instalar GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      
      - name: Compilar programa COBOL
        run: |
          mkdir -p bin
          cobc -x -o bin/validador src/validador.cob \
            src/modulos/validar-cpf.cob \
            src/modulos/validar-cnpj.cob \
            src/modulos/validar-ie.cob
      
      - name: Validar documento
        run: |
          bin/validador "${{ github.event.inputs.tipo_documento }}" \
                        "${{ github.event.inputs.numero_documento }}"
      
      - name: Resultado
        if: success()
        run: echo "Documento válido!"
      
      - name: Falha na validação
        if: failure()
        run: echo "Documento inválido!"
